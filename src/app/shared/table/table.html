<div class="table-container mat-elevation-z1" [style.width]="width" [style.max-height]="height">
  <h2 class="title" *ngIf="title">{{ title }}</h2>

  <div class="scroll-viewport" [style.max-height]="height === 'auto' ? 'none' : height">
    <table mat-table [dataSource]="dataSource">
      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef>{{ col.label }}</th>
        <td mat-cell *matCellDef="let element">{{ element[col.key] }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
